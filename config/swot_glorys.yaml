# SWOT -> GLORYS: real KaRIn swaths initialize the forecast.
#
#     python runs/forecast.py --config config/swot_glorys.yaml
#
# One schema for every run; run.source picks where observations come from.
# Paths resolve against the repository root, not this file or the cwd.

run:
  source: swot

data:
  zarr_glob: "data/glorys/glorys_gom*_subset.zarr"
  swot_dir: "data/swot"
  swot_points_dir: "data/swot_points"
  fig_dir: figures_swot_glorys

domain:
  min_longitude: null
  max_longitude: null
  min_latitude: null
  max_latitude: null

periods:
  library:
    start: "1993-01-01"
    end: "2022-12-31"
  target:
    start: "2023-01-01"
    end: "2025-12-31"

climatology:
  group: climday
  reduce_dims: []

swot:
  collection: expert_d
  bbox: [-98.0, 18.0, -78.0, 32.0]

observation:
  dates: null
  n_days: 3
  stride: 1
  min_cells_per_day: 200
  require_days: 1
  weights: uniform
  halflife: 3.0
  max_swaths_per_day: null
  front_cover_min: 0.2

analogs:
  distance: ssh_rmsd # distance: correlation
  k: 10
  buffer_days: 14
  ssh_contour_level: 0.17
  region: null
  # region:
  #   min_longitude: -92.5
  #   max_longitude: -80.0
  #   min_latitude: null
  #   max_latitude: null

forecast:
  leads: [0, 10, 20, 30]
  headline_lead: 30
  score_every_day_to: 30
  score_metrics: [ssh_rmse, ssh_acc, ssh_front_mhd]
  combiner: ensemble_mean
  region: null

figures:
  diagnostics: false
  k_show: 6
  demo_day: null
