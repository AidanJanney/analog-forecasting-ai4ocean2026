# GLORYS -> GLORYS, front-MHD selection. One of the select_* comparison set.
#
#     python runs/forecast.py --config config/select_ssh_front_mhd.yaml
#
# One schema for every run; run.source picks where observations come from.
# Paths resolve against the repository root, not this file or the cwd.

run:
  source: model

data:
  zarr_glob: "data/glorys/glorys_gom*_subset.zarr"
  fig_dir: figures_ssh_front_mhd

domain:
  min_longitude: -92.5
  max_longitude: -80.0
  min_latitude: null
  max_latitude: null

periods:
  library:
    start: "1993-01-01"
    end: "2022-06-30"
  target:
    start: "2023-01-01"
    end: "2025-12-31"

climatology:
  group: climday
  reduce_dims: []

observation:
  dates: ["2023-06-15"]
  n_days: 1
  stride: 1
  min_cells_per_day: 1
  require_days: 1
  weights: uniform
  halflife: 3.0
  max_swaths_per_day: null
  front_cover_min: null

analogs:
  distance: ssh_front_mhd
  k: 10
  buffer_days: 14
  ssh_contour_level: 0.17
  region: null

forecast:
  leads: [0, 10, 20, 30]
  headline_lead: 30
  score_every_day_to: 30
  score_metrics: [sst_rmse, ssh_rmse, sst_acc, ssh_acc, ssh_front_mhd]
  combiner: ensemble_mean
  region: null

figures:
  diagnostics: true
  k_show: 6
  demo_day: null
